openapi: 3.0.0

info:
  title: API PHP - Sistema de Autenticação e Cadastro
  version: 1.0.0
  description: API simples em PHP para apoiar o desenvolvimento da interface, com foco em cadastro de usuário e login.

servers:
  - url: http://localhost/api/public
    description: Desenvolvimento

  - url: https://devgarca.com.br/ssinnova/api
    description: Produção

tags:
  - name: Autenticação
  - name: Cadastro

paths:

  /index.php?rota=cadastro:
    post:
      tags:
        - Cadastro

      summary: Cadastrar um novo usuário
      description: Cadastrar um novo usuário com dados pessoais e dados de entrega.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroRequest'

      responses:
        '201':
          description: Usuário cadastrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroSuccessResponse'

        '400':
          description: Erros de validação (Campos obrigatórios ausentes, E-mail inválido, Senha muito curta).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CamposObrigatorios:
                  value:
                    status: false
                    mensagem: Todos os campos são obrigatórios.
                EmailInvalido:
                  value:
                    status: false
                    mensagem: E-mail inválido.
                SenhaCurta:
                  value:
                    status: false
                    mensagem: A senha deve ter pelo menos 6 caracteres.

        '409':
          description: E-mail já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EmailJaCadastrado:
                  value:
                    status: false
                    mensagem: Já existe um usuário com este e-mail.

  /index.php?rota=login:
    post:
      tags:
        - Autenticação

      summary: Autenticar um usuário
      description: Realiza o login do usuário retornando os dados e o token de autenticação.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Login realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'

        '400':
          description: Erros de validação (E-mail e senha não enviados, E-mail inválido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CamposObrigatorios:
                  value:
                    status: false
                    mensagem: E-mail e senha são obrigatórios.
                EmailInvalido:
                  value:
                    status: false
                    mensagem: E-mail inválido.

        '401':
          description: Senha incorreta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SenhaIncorreta:
                  value:
                    status: false
                    mensagem: Senha incorreta.

        '403':
          description: Usuário inativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UsuarioInativo:
                  value:
                    status: false
                    mensagem: Usuário inativo.

        '404':
          description: E-mail não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EmailNaoEncontrado:
                  value:
                    status: false
                    mensagem: E-mail não encontrado.

  /index.php?rota=atualizar&id={id}:
    put:
      tags:
        - Cadastro
      summary: Atualizar usuário
      description: Atualiza os dados de um usuário existente.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do usuário a ser atualizado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarRequest'
      responses:
        '200':
          description: Atualização realizada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  mensagem:
                    type: string
                    example: Atualização realizada com sucesso.
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          description: Erros de validação ou ID inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token inválido ou não fornecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Não tem permissão para alterar este usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: E-mail já em uso por outro usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /index.php?rota=deletar&id={id}:
    delete:
      tags:
        - Cadastro
      summary: Excluir usuário
      description: Remove permanentemente um usuário pelo seu ID.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do usuário a ser deletado
      responses:
        '204':
          description: No Content. Usuário deletado com sucesso.
        '400':
          description: ID inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token inválido ou não fornecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Não tem permissão para excluir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    CadastroRequest:
      type: object
      required:
        - nome
        - email
        - senha
        - cep
        - logradouro
        - bairro
        - localidade
        - estado
        - uf
      properties:
        nome:
          type: string
          example: Robson Ramos
        email:
          type: string
          example: robson@email.com
        senha:
          type: string
          example: "123456"
        cep:
          type: string
          example: "17400-000"
        logradouro:
          type: string
          example: Rua Exemplo
        bairro:
          type: string
          example: Centro
        localidade:
          type: string
          example: Garça
        estado:
          type: string
          example: São Paulo
        uf:
          type: string
          example: SP
        status:
          type: string
          example: ativo

    AtualizarRequest:
      type: object
      properties:
        nome:
          type: string
          example: Robson Ramos Silva
        email:
          type: string
          example: robson.silva@email.com
        senha:
          type: string
          example: "novasenha123"
        cep:
          type: string
          example: "17400-000"
        logradouro:
          type: string
          example: Rua Nova
        bairro:
          type: string
          example: Centro
        localidade:
          type: string
          example: Garça
        estado:
          type: string
          example: São Paulo
        uf:
          type: string
          example: SP
        status:
          type: string
          example: ativo

    LoginRequest:
      type: object
      required:
        - email
        - senha
      properties:
        email:
          type: string
          example: robson@email.com
        senha:
          type: string
          example: "123456"

    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Robson Ramos
        email:
          type: string
          example: robson@email.com
        cep:
          type: string
          example: "17400-000"
        logradouro:
          type: string
          example: Rua Exemplo
        bairro:
          type: string
          example: Centro
        localidade:
          type: string
          example: Garça
        estado:
          type: string
          example: São Paulo
        uf:
          type: string
          example: SP
        status:
          type: string
          example: ativo
        data_cadastro:
          type: string
          example: "2026-03-30 14:30:00"
        data_atualizacao:
          type: string
          example: "2026-03-30 14:30:00"

    CadastroSuccessResponse:
      type: object
      properties:
        status:
          type: boolean
          example: true
        mensagem:
          type: string
          example: Usuário cadastrado com sucesso.
        usuario:
          $ref: '#/components/schemas/Usuario'

    LoginSuccessResponse:
      type: object
      properties:
        status:
          type: boolean
          example: true
        mensagem:
          type: string
          example: Login realizado com sucesso.
        token:
          type: string
          example: "4d8c9f2a1b6e7c3d9a0f4b2c8e1d6f7a"
        usuario:
          $ref: '#/components/schemas/Usuario'

    ErrorResponse:
      type: object
      properties:
        status:
          type: boolean
          example: false
        mensagem:
          type: string
          example: Mensagem de erro descritiva.